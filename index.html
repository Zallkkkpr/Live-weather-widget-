<!-- WEATHER API WIDGET - Zalak ke liye -->
<div id="weather-widget" style="background: #f0f4ff; padding: 15px; border-radius: 12px; text-align: center; margin: 20px 0; font-family: sans-serif;">
  <h3 style="margin:0;">🌤️ Vadgam ka Weather</h3>
  <p id="weather-temp" style="font-size: 22px; font-weight: bold;">Loading...</p>
  <p id="weather-desc" style="margin:0; color: #555;"></p>
</div>

<script>
// Simple Weather API - Free wala, key ki zarurat nahi
async function getWeather() {
  try {
    // Vadgam ke coordinates use kar rahe hai
    const response = await fetch('https://api.open-meteo.com/v1/forecast?latitude=24.05&longitude=72.48&current_weather=true');
    const data = await response.json();
    
    document.getElementById('weather-temp').innerText = data.current_weather.temperature + '°C';
    document.getElementById('weather-desc').innerText = 'Wind: ' + data.current_weather.windspeed + ' km/h - Live API se';
  } catch (error) {
    document.getElementById('weather-temp').innerText = 'API Error';
  }
}
getWeather();
</script>
